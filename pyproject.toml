[project]
name = "job-market-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.0",
    "snowflake-connector-python>=3.6.0",
    "python-dotenv>=1.0.0",
    "azure-storage-file-datalake>=12.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "rapidfuzz>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Test suite was moved to archive/tests/ during the 2026-09-29 repo cleanup.
# pythonpath=["."] keeps the repo root importable so `from pipeline...` resolves;
# testpaths points at the relocated suite; the scraper probes under
# archive/tests/scraper_probes are standalone scripts, not pytest tests.
pythonpath = ["."]
testpaths = ["archive/tests"]
addopts = "--ignore=archive/tests/scraper_probes"
